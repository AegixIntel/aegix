# Production reference stack. Supply every ${VAR:?required} through an
# orchestrator/secret manager; do not commit a production .env file.
#
# Design notes (release-gate verification, 2026-09):
#   - Public beta ships IN_APP notifications only: EMAIL_ENABLED /
#     ENABLE_EMAIL_NOTIFICATIONS stay "false" and all email routes return
#     403 FEATURE_DISABLED. SMTP is never a startup dependency.
#   - Healthchecks probe 127.0.0.1 explicitly: "localhost" in Alpine resolves
#     to ::1 first, which made healthy services report unhealthy (IPv4 bind).
#   - RPC_PRIMARY/SECONDARY/TERTIARY_URL are passed as "${VAR:-}" and are
#     treated as unset by the config loader when empty (compose default).
#     A single RPC_URL yields a startup warning, not a crash.
#   - Only the proxy publishes a host port; PostgreSQL/Redis/API/web stay on
#     the private Compose network. Redis runs noeviction + requirepass.
#   - migrate runs the compiled dist/migrate.js (no tsx) under
#     NODE_ENV=production with a Postgres advisory lock; API/worker depend on
#     service_completed_successfully, so they never start on a failed migrate.
#   - The worker healthcheck runs dist/healthcheck.js and requires a fresh
#     Redis heartbeat plus working DB and queue connections.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes: ["postgres-production-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$${REDIS_PASSWORD}\""]
    volumes: ["redis-production-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?required}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment: &runtime-environment
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: ${REDIS_URL:?required}
      RPC_URL: ${RPC_URL:?required}
      RPC_PRIMARY_URL: ${RPC_PRIMARY_URL:-}
      RPC_SECONDARY_URL: ${RPC_SECONDARY_URL:-}
      RPC_TERTIARY_URL: ${RPC_TERTIARY_URL:-}
      AUTH_DOMAIN: ${PUBLIC_WEB_ORIGIN:?required}
      AUTH_APP_URI: ${PUBLIC_WEB_ORIGIN:?required}
      CORS_ORIGIN: ${PUBLIC_WEB_ORIGIN:?required}
      # nginx (the only published service) forwards /api/ straight to the API,
      # so exactly one proxy hop is trusted for the client IP. Without it the
      # rate limit and anonymous quota are shared by every visitor.
      TRUST_PROXY_HOPS: "1"
      ENABLE_LEGACY_AUTH: "false"
      EMAIL_ENABLED: "false"
      ENABLE_EMAIL_NOTIFICATIONS: "false"
      ENABLE_WEBHOOK_DELIVERY: ${ENABLE_WEBHOOK_DELIVERY:-true}
      # The application performs the conditional fail-fast check: this may be
      # empty only when ENABLE_WEBHOOK_DELIVERY=false.
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      # D14: Rewind, Discovery and their series sources. All off unless the
      # operator sets them; see docs/milestone-d14-rewind-discovery.md §6.
      ENABLE_REWIND_CAPTURE: ${ENABLE_REWIND_CAPTURE:-false}
      ENABLE_REWIND: ${ENABLE_REWIND:-false}
      ENABLE_DISCOVERY: ${ENABLE_DISCOVERY:-false}
      ENABLE_DISCOVERY_DAILY: ${ENABLE_DISCOVERY_DAILY:-false}
      ENABLE_DISCOVERY_ANCHOR: ${ENABLE_DISCOVERY_ANCHOR:-false}
      ENABLE_TOKENIZED_STOCK_CAPTURE: ${ENABLE_TOKENIZED_STOCK_CAPTURE:-false}
      ENABLE_NARRATIVE_CAPTURE: ${ENABLE_NARRATIVE_CAPTURE:-false}
      ENABLE_NARRATIVE_CONTEXT_CAPTURE: ${ENABLE_NARRATIVE_CONTEXT_CAPTURE:-false}
      ENABLE_OPTIONS_CAPTURE: ${ENABLE_OPTIONS_CAPTURE:-false}
      ENABLE_SECTOR_CAPTURE: ${ENABLE_SECTOR_CAPTURE:-false}
      ENABLE_CONTEXT_SIGNAL_CAPTURE: ${ENABLE_CONTEXT_SIGNAL_CAPTURE:-false}
      # D15: see docs/milestone-d15-market-intelligence-engines.md §6.
      ENABLE_ANOMALY_CAPTURE: ${ENABLE_ANOMALY_CAPTURE:-false}
      ENABLE_ANOMALY_DETECTION: ${ENABLE_ANOMALY_DETECTION:-false}
      ENABLE_NARRATIVE_RADAR: ${ENABLE_NARRATIVE_RADAR:-false}
      ENABLE_SIGNAL_ENGINE: ${ENABLE_SIGNAL_ENGINE:-false}
      ENABLE_CROSS_MARKET: ${ENABLE_CROSS_MARKET:-false}
      # D16: see docs/milestone-d16-ai-copilot.md.
      ENABLE_AI_COPILOT: ${ENABLE_AI_COPILOT:-false}
      # The model provider Ask AEGIX and the copilot call. Empty means none is
      # configured: both answer 503 and nothing else changes.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # For a model that reasons before it answers: the reasoning counts
      # against the output ceiling and the answer comes back cut off.
      LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-false}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-900}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment: *runtime-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        API_INTERNAL_URL: http://api:3001
        # Canonical URLs, sitemap and Open Graph metadata are rendered at build time.
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEB_ORIGIN:?required}
    environment:
      NODE_ENV: production
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${AEGIX_HTTP_PORT:-80}:8080"
    volumes:
      - ./infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-production-data:
  redis-production-data:
