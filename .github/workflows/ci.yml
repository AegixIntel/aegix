      - name: Run D11 billing E2E
        run: |
          mkdir -p artifacts
          set -o pipefail
          {
            pnpm test:e2e-d11
            pnpm test:e2e-d11-revenue-safety
          } 2>&1 | tee artifacts/e2e-d11.log
      - name: Upload D11 logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with: { name: e2e-d11-logs, path: artifacts/e2e-d11.log, retention-days: 7 }

  docker-images:
    name: Production Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f infra/docker/api.Dockerfile -t aegix-api:ci .
      - run: docker build -f infra/docker/worker.Dockerfile -t aegix-worker:ci .
      - run: docker build -f infra/docker/web.Dockerfile --build-arg NEXT_PUBLIC_API_URL=/api -t aegix-web:ci .
      - run: docker build -f infra/docker/migrate.Dockerfile -t aegix-migrate:ci .
